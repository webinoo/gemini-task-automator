name: Build Gemini Automator EXE

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup vcpkg and Install Dependencies
      uses: lukka/run-vcpkg@v11
      with:
        vcpkgDirectory: '${{ github.workspace }}/vcpkg'
        vcpkgJsonGlob: 'vcpkg.json'
        vcpkgGitCommitId: '50302b1f83c18c50e2ed2014023dd4195191a5ef'

    - name: Configure CMake
      run: >
        cmake -B ${{ github.workspace }}/build
        -DCMAKE_BUILD_TYPE=Release
        -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake

    - name: Build Standalone Binary
      run: cmake --build ${{ github.workspace }}/build --config Release

    - name: Upload Built Executable Artifact
      uses: actions/upload-artifact@v4
      with:
        name: GeminiAutomator-Windows-x64
        path: ${{ github.workspace }}/build/Release/GeminiAutomator.exe